<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WatchTower Sign Up</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600;700;800&display=swap"
    rel="stylesheet"
  >
  <link rel="preload" href="../styling/navbar.css" as="style">
  <link rel="stylesheet" href="../styling/base.css">
  <link rel="stylesheet" href="../styling/signup.css">
</head>
<body class="signup-page">
  <watchtower-navbar variant="minimal"></watchtower-navbar>

  <main class="signup-shell">
    <section class="signup-card" aria-label="Sign up form">
      <div class="signup-card-header">
        <h1>Get started with WatchTower</h1>
        <p>Already have an account? <a href="login.html" data-login-link>Sign in</a></p>
      </div>


      <form class="signup-form" id="signup-form" novalidate>
        <div class="form-field">
          <label for="name">Name</label>
          <input
            id="name"
            name="username"
            type="text"
            autocomplete="name"
            placeholder="Bruce Wayne"
            aria-describedby="name-error"
            required
          >
          <p class="field-error" id="name-error"></p>
        </div>

        <div class="form-field">
          <label for="email">Email</label>
          <input
            id="email"
            name="email"
            type="email"
            autocomplete="email"
            placeholder="me@mywebsite.com"
            aria-describedby="email-error"
            required
          >
          <p class="field-error" id="email-error"></p>
        </div>

        <div class="form-field">
          <label for="password">Password</label>
          <input
            id="password"
            name="password"
            type="password"
            autocomplete="new-password"
            placeholder="********"
            minlength="8"
            aria-describedby="password-error"
            required
          >
          <p class="field-error" id="password-error"></p>
        </div>

        <div class="form-actions">
          <a href="/" class="button button-secondary" aria-label="Back to home">
            <svg class="button-icon" viewBox="0 0 20 20" aria-hidden="true" focusable="false">
              <path d="M16 10H6M9.5 6.5 6 10l3.5 3.5"></path>
            </svg>
          </a>
          <button type="submit" class="button button-primary signup-submit">
            <span>Sign up</span>
            <svg class="button-icon" viewBox="0 0 20 20" aria-hidden="true" focusable="false">
              <path d="M4 10h10M10.5 6.5 14 10l-3.5 3.5"></path>
            </svg>
          </button>
        </div>
      </form>

      <p class="terms-copy">
        By signing up, you agree to the <a href="#terms">Terms &amp; Conditions</a>
        and <a href="#privacy">Privacy Policy</a>.
      </p>
    </section>
  </main>

  <script src="../js/components/wt-base-element.js"></script>
  <script src="../js/components/navbar.js"></script>
  <script src="../js/utils.js" defer></script>
  <script src="../js/signup.js" defer></script>
</body>
</html>
