<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Advanced Performance Metrics</title>
    <link rel="preload" href="../styling/navbar.css" as="style">
    <link rel="preload" href="../styling/dash_navbar.css" as="style">
    <link rel="stylesheet" href="../styling/base.css">
    <link rel="stylesheet" href="../styling/dashboard.css">
    <link rel="stylesheet" href="../styling/performance.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">
</head>

<body class="container">
    <wt-dash-layout active="performance">
        <main class="standalone-main">
            <header class="page-header">
                <div class="header-content">
                    <h1>Performance</h1>
                    <p>Monitor latency, response times, and system performance</p>
                </div>
                <form class="filters">

                    <div class="filter-card">
                        <div class="filter-icon">
                            <img src="../assets/calendar-icon.svg" alt="Calendar Icon">
                        </div>

                        <input
                            id="date-range"
                            class="date-range-input"
                            type="text"
                            placeholder="Select date range"
                        >
                    </div>

                    <div class="filter-card toggle-card">
                        <span class="refresh-icon" aria-hidden="true">↻</span>
                        <span class="toggle-label">Auto Refresh</span>

                        <label class="toggle-switch">
                            <span class="toggle-status">ON</span>
                            <input type="checkbox" checked>
                            <span class="toggle-slider"></span>
                        </label>
                    </div>

                </form>
            </header>

            <section class="kpi-grid">
                <wt-metric-card name="Avg Response Time"
                    value-id="avg-response-time"
                    compare-text="API latency"
                    sparkline-id="avg-response-sparkline">
                </wt-metric-card>

                <wt-metric-card name="P95 Latency"
                    value-id="p95-latency"
                    compare-text="Slowest 5% of requests"
                    sparkline-id="p95-latency-sparkline">
                </wt-metric-card>

                <wt-metric-card name="Slowest Endpoint"
                    value-id="slowest-endpoint"
                    compare-text="By average latency"
                    sparkline-id="slowest-endpoint-sparkline">
                </wt-metric-card>

                <wt-metric-card name="Avg Page Load"
                    value-id="avg-page-load-time"
                    compare-text="Page load time"
                    sparkline-id="avg-page-load-sparkline">
                </wt-metric-card>

                <wt-metric-card name="Avg Memory"
                    value-id="avg-memory-usage"
                    compare-text="Memory usage"
                    sparkline-id="avg-memory-sparkline">
                </wt-metric-card>
            </section>

            <section class="chart-grid">

                <wt-dash-section eyebrow="Latency trends" heading="Latency Over Time">
                    <select slot="header-end" id="line-toggle">
                        <option value="all">All Endpoints</option>
                        <option value="avg-latency">Average Latency</option>
                        <option value="p95-latency">P95 Latency</option>
                        <option value="avg-page-load-time">Average Page Load Time</option>
                    </select>
                    <div class="chart-canvas-wrapper">
                        <canvas id="latency-chart"></canvas>
                    </div>
                </wt-dash-section>

                <wt-dash-section eyebrow="API breakdown" heading="Endpoint Performance">
                    <div class="chart-canvas-wrapper">
                        <canvas id="endpoint-performance-chart"></canvas>
                    </div>
                </wt-dash-section>

                <wt-dash-section eyebrow="Performance analysis" heading="Bottleneck Insights">
                    <div class="insight-list">
                        <wt-insight-item card-id="slowest-endpoint-card" label="Slowest Endpoint"
                            insight-id="slowest-endpoint-insight" metric-id="slowest-endpoint-latency">
                        </wt-insight-item>

                        <wt-insight-item card-id="highest-ttfb-card" label="Highest Time To First Byte"
                            insight-id="highest-ttfb-endpoint" metric-id="highest-ttfb-value">
                        </wt-insight-item>
                    </div>
                </wt-dash-section>

            </section>

            <section class="slow-requests-section">
                <wt-dash-section eyebrow="Request log" heading="Slow Requests">
                    <table>
                        <thead>
                            <tr>
                                <th>Time</th>
                                <th>Endpoint</th>
                                <th>Latency</th>
                                <th>Load Time</th>
                                <th>Time To First Byte</th>
                                <th>Memory</th>
                            </tr>
                        </thead>
                        <tbody id="slow-requests-body"></tbody>
                    </table>
                </wt-dash-section>
            </section>
        </main>
    </wt-dash-layout>

    <script src="../js/components/wt-base-element.js"></script>
    <script src="../js/components/navbar.js"></script>
    <script src="../js/components/dash_navbar.js"></script>
    <script src="../js/components/wt-dash-layout.js"></script>
    <script src="../js/components/wt-metric-card.js"></script>
    <script src="../js/components/wt-insight-item.js"></script>
    <script src="../js/components/wt-dash-section.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js" defer></script>
    <script src="https://cdn.jsdelivr.net/npm/flatpickr" defer></script>
    <script src="../js/utils.js" defer></script>
    <script src="../js/performance.js" defer></script>
    <script src="../js/auth.js" defer></script>
</body>

</html>
