<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WatchTower Login</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600;700;800&display=swap"
    rel="stylesheet"
  >
  <link rel="stylesheet" href="../styling/login.css">
</head>
<script>
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('/sw.js');
    });
  }
</script>
<body class="login-page">
  <header class="auth-header">
    <a href="../index.html" class="brand-link" data-home-link aria-label="WatchTower home">
      <img src="../assets/watchtower-logo.png" alt="WatchTower">
    </a>
  </header>

  <main class="login-shell">
    <section class="login-card" aria-label="Sign in form">
      <div class="login-card-header">
        <h1>Sign in to WatchTower</h1>
        <p>Don't have an account? <a href="signup.html" data-signup-link>Get started</a></p>
      </div>


      <form class="login-form" id="login-form" novalidate>
        <div class="form-field">
          <label for="email">Email</label>
          <input
            id="email"
            name="email"
            type="email"
            autocomplete="email"
            placeholder="me@mywebsite.com"
            aria-describedby="email-error"
            required
          >
          <p class="field-error" id="email-error"></p>
        </div>

        <div class="form-field">
          <label for="password">Password</label>
          <input
            id="password"
            name="password"
            type="password"
            autocomplete="current-password"
            placeholder="********"
            aria-describedby="password-error"
            required
          >
          <p class="field-error" id="password-error"></p>
        </div>

        <div class="form-actions">
          <a href="/" class="button button-secondary" aria-label="Back to home">
            <svg class="button-icon" viewBox="0 0 20 20" aria-hidden="true" focusable="false">
              <path d="M16 10H6M9.5 6.5 6 10l3.5 3.5"></path>
            </svg>
          </a>
          <button type="submit" class="button button-primary login-submit">
            <span>Sign in</span>
            <svg class="button-icon" viewBox="0 0 20 20" aria-hidden="true" focusable="false">
              <path d="M4 10h10M10.5 6.5 14 10l-3.5 3.5"></path>
            </svg>
          </button>
        </div>
      </form>
    </section>
  </main>

  <script src="../js/login.js" defer></script>
</body>
</html>
