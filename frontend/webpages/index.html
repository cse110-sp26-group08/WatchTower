<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WatchTower Homepage</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap"
    rel="stylesheet"
  >
  <link rel="stylesheet" href="../styling/homepage.css">
</head>
<body class="homepage">
  <header class="site-header">
    <nav class="site-nav" aria-label="Main navigation">
      <div class="brand-mark">
        <a href="./" class="brand-link">WatchTower</a>
      </div>

      <ul class="nav-links">
        <li><a href="./docs">Docs</a></li>
      </ul>

      <div class="nav-actions">
        <a href="./login" class="nav-login">Log in</a>
        <a href="./signup" class="button button-primary">Get started</a>
      </div>
    </nav>
  </header>

  <main class="hero-shell">
    <section class="hero" aria-label="Hero">
      <div class="hero-copy">
        <p class="eyebrow">Watch smarter</p>
        <h1>Catch all your errors in real-time!</h1>
        <p class="hero-description">
          catches errors, bugs, and notifies you when they happen
        </p>
      </div>

    </section>
  </main>
</body>
</html>
