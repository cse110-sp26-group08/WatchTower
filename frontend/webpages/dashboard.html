<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard</title>

    <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>

    <link rel="preload" href="../styling/navbar.css" as="style">
    <link rel="preload" href="../styling/dash_navbar.css" as="style">
    <link rel="stylesheet" href="../styling/base.css">
    <link rel="stylesheet" href="../styling/dashboard.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">
    <link rel="icon" type="image/x-icon" href="assets/favicon-here.ico">
</head>

<body class="container">
    <wt-dash-layout active="home">
        <div class="main-dash">
            <header class="page-header">
                <div class="header-content">
                    <h1>Dashboard</h1>
                    <p>Monitor your app's uptime, performance, and reliability.</p>
                </div>
                <form class="filters">
                    <wt-date-filter></wt-date-filter>
                </form>
            </header>
            <div class="status-container">
                <div class="status-card status-main">
                    <p class="status-eyebrow">System Performance Diagnosis</p>
                    <h2>Current Site Status</h2>
                    <p class="status-project" id="status-project">Loading project...</p>

                    <div class="status-row">
                        <div class="status-indicator">
                            <span class="status-symbol">&#9679;</span>
                            <span class="status-text" id="status-text">UP</span>
                        </div>
                        <p class="status-detail" id="status-description">Loading recent service health...</p>
                    </div>
                    <a class="project-url-link" id="project-url-link" href="#" target="_blank" rel="noopener noreferrer" hidden>
                        Visit project website ↗
                    </a>
                    <div class="apikey-section">
                        <p class="apikey-label">API Key</p>
                        <div class="apikey-row">
                            <code class="apikey-display" id="apikey-value">&#x2022;&#x2022;&#x2022;&#x2022;&#x2022;&#x2022;&#x2022;&#x2022;&#x2022;&#x2022;&#x2022;&#x2022;&#x2022;&#x2022;&#x2022;&#x2022;</code>
                            <button class="apikey-icon-btn" id="apikey-toggle" type="button" aria-label="Show API key">
                                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
                            </button>
                            <button class="apikey-icon-btn" id="apikey-copy" type="button" aria-label="Copy API key" hidden>
                                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
                            </button>
                        </div>
                    </div>
                </div>

                <wt-health-score
                    title="Performance"
                    eyebrow="Health Score"
                    prefix="performance"
                    icon-path="M3 12h4l2-7 4 14 2-7h6"
                    support-text="Performance is within normal range.">
                </wt-health-score>

                <wt-health-score
                    title="Reliability"
                    eyebrow="Health Score"
                    prefix="reliability"
                    icon-path="M12 3l7 3v5c0 4.4-2.8 8.4-7 10-4.2-1.6-7-5.6-7-10V6l7-3z"
                    support-text="Low error rate and stable system health.">
                </wt-health-score>
            </div>
        </div>
    </wt-dash-layout>

    <script src="../js/components/wt-base-element.js"></script>
    <script src="../js/components/navbar.js"></script>
    <script src="../js/components/dash_navbar.js"></script>
    <script src="../js/components/wt-dash-layout.js"></script>
    <script src="../js/components/wt-health-score.js"></script>
    <script src="../js/components/wt-date-filter.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/flatpickr" defer></script>
    <script src="../js/utils.js" defer></script>
    <script src="../js/dashboard.js" defer></script>
    <script src="../js/auth.js" defer></script>
</body>

</html>
